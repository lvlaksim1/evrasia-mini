<!doctype html>
<html lang="ru" data-app="evrasia-max-direct">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#081310">
  <meta name="color-scheme" content="dark light">
  <style>
    :root{--bg:#081310;--text:#f2f7f5;--hint:#8ea09a;--surface:#10201b;--button:#2ea6ff;--button-text:#fff;--danger:#ff5f57;--line:rgba(242,247,245,.13)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;min-height:100dvh;overscroll-behavior:none}button,input{font:inherit}.app{width:100%;max-width:720px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom))}.search-shell{position:sticky;top:0;z-index:5;padding:6px 0 10px;background:var(--bg)}.search{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;outline:none;padding:0 14px;background:var(--surface);color:var(--text);font-size:16px}.search::placeholder{color:var(--hint)}.search:focus{border-color:var(--button)}.meta{min-height:24px;padding:0 4px 6px;color:var(--hint);font-size:13px}.list{display:flex;flex-direction:column;gap:7px}.section-title{padding:10px 4px 2px;color:var(--hint);font-size:12px;font-weight:700;text-transform:uppercase}.restaurant{width:100%;min-height:50px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--surface);color:var(--text);text-align:left;cursor:pointer}.restaurant.recent:before{content:'↻ ';color:var(--hint)}.empty,.fatal{display:none;padding:24px 10px;color:var(--hint);text-align:center}.fatal{color:var(--danger)}.confirm-layer{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(0,0,0,.32)}.confirm-layer.open{display:flex}.confirm-card{width:100%;max-width:720px;margin:0 auto;padding:18px 14px calc(14px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:var(--surface)}.confirm-title{margin:0 0 8px;font-size:18px;font-weight:650}.confirm-message{min-height:20px;margin:0 0 16px;color:var(--hint);font-size:14px;line-height:1.4;white-space:pre-line}.actions{display:grid;grid-template-columns:1fr;gap:8px}.action{width:100%;min-height:48px;border:0;border-radius:13px;padding:10px 14px;cursor:pointer;font-weight:650}.primary{background:var(--button);color:var(--button-text)}.secondary{background:var(--surface);color:var(--text);border:1px solid var(--line)}.cancel{background:rgba(255,95,87,.13);color:var(--danger);border:1px solid rgba(255,95,87,.32)}.action:disabled{opacity:.55}
  </style>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>
  <main class="app">
    <div class="search-shell"><input id="search" class="search" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Поиск ресторана"></div>
    <div class="meta" id="meta">Загрузка списка…</div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty">Ничего не найдено</div>
    <div class="fatal" id="fatal"></div>
  </main>
  <div class="confirm-layer" id="confirm" aria-hidden="true"><section class="confirm-card"><h2 class="confirm-title" id="confirmTitle"></h2><p class="confirm-message" id="confirmMessage">Получить чекин?</p><div class="actions"><button class="action primary" id="confirmButton" type="button">Получить чекин</button><button class="action cancel" id="cancelButton" type="button">Отмена</button></div></section></div>
  <script>
  (function(){'use strict';
    const BACKEND_URL='https://script.google.com/macros/s/AKfycbxPCQZFC67ctgflcNqEpyZkp1b8uro1dDjoA8jskpvH9axPvOdwRruVlninxDSquZC50g/exec';
    const CACHE_KEY='evrasia_max_restaurants_v2',RECENT_KEY='evrasia_max_recent_v1',RECENT_LIMIT=5;
    const list=document.getElementById('list'),search=document.getElementById('search'),meta=document.getElementById('meta'),empty=document.getElementById('empty'),fatal=document.getElementById('fatal'),layer=document.getElementById('confirm'),title=document.getElementById('confirmTitle'),message=document.getElementById('confirmMessage'),confirmButton=document.getElementById('confirmButton'),cancelButton=document.getElementById('cancelButton');
    let restaurants=[],selected=null,running=false,resultShown=false,preferredBusy=false,fallbackToken='',callbackSerial=0;
    function webApp(){return window.WebApp||null}function initData(){const app=webApp();return app?String(app.initData||''):''}function normalize(v){return String(v||'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/[«»"'`.,()\-–—/\\]/g,' ').replace(/\s+/g,' ').trim()}function rows(v){return(Array.isArray(v)?v:[]).map(r=>({id:String(r.id||''),title:String(r.title||''),search:normalize(r.title)})).filter(r=>r.id&&r.title)}
    function jsonp(params,timeoutMs){return new Promise(function(resolve,reject){callbackSerial+=1;const name='__evrasiaMax'+Date.now().toString(36)+callbackSerial.toString(36),script=document.createElement('script'),query=new URLSearchParams(params||{});query.set('api','max');query.set('callback',name);const timer=setTimeout(function(){cleanup();reject(new Error('Сервер не ответил вовремя.'))},timeoutMs||15000);function cleanup(){clearTimeout(timer);try{delete window[name]}catch(e){window[name]=undefined}if(script.parentNode)script.parentNode.removeChild(script)}window[name]=function(payload){cleanup();resolve(payload)};script.onerror=function(){cleanup();reject(new Error('Не удалось связаться с сервером.'))};script.src=BACKEND_URL+'?'+query.toString();document.head.appendChild(script)})}
    function readRecent(){try{const v=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');return Array.isArray(v)?v.map(String).slice(0,RECENT_LIMIT):[]}catch(e){return[]}}function rememberRecent(row){if(!row)return;const ids=readRecent().filter(id=>id!==row.id);ids.unshift(row.id);try{localStorage.setItem(RECENT_KEY,JSON.stringify(ids.slice(0,RECENT_LIMIT)))}catch(e){}}
    function button(row,recent){const b=document.createElement('button');b.type='button';b.className='restaurant'+(recent?' recent':'');b.textContent=row.title;b.onclick=()=>show(row);return b}function section(text){const d=document.createElement('div');d.className='section-title';d.textContent=text;return d}
    function rank(row,q,tokens){if(!q)return 100;if(row.search===q)return 0;if(row.search.indexOf(q)===0)return 1;const words=row.search.split(' ');if(tokens.every(t=>words.some(w=>w.indexOf(t)===0)))return 2;if(tokens.every(t=>row.search.indexOf(t)>=0))return 3;return 99}
    function render(){const q=normalize(search.value),tokens=q?q.split(' '):[],fragment=document.createDocumentFragment();let filtered=restaurants.filter(r=>tokens.every(t=>r.search.indexOf(t)>=0)).map((r,i)=>({r,score:rank(r,q,tokens),i})).sort((a,b)=>a.score-b.score||a.i-b.i||a.r.title.localeCompare(b.r.title,'ru')).map(x=>x.r);if(!tokens.length){const byId={};restaurants.forEach(r=>byId[r.id]=r);const recent=readRecent().map(id=>byId[id]).filter(Boolean);if(recent.length){fragment.appendChild(section('Недавние'));recent.forEach(r=>fragment.appendChild(button(r,true)));fragment.appendChild(section('Все рестораны'))}}filtered.forEach(r=>fragment.appendChild(button(r,false)));list.replaceChildren(fragment);meta.textContent=tokens.length?'Найдено: '+filtered.length:'Ресторанов: '+restaurants.length;empty.style.display=restaurants.length&&!filtered.length?'block':'none'}
    async function load(){try{const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'),cachedRows=rows(cached&&cached.restaurants);if(cachedRows.length){restaurants=cachedRows;render()}const payload=await jsonp({op:'restaurants'},10000);if(!payload||!payload.ok)throw new Error(payload&&payload.error||'Не удалось загрузить рестораны.');restaurants=rows(payload.restaurants);try{localStorage.setItem(CACHE_KEY,JSON.stringify({restaurants:payload.restaurants,version:payload.version||''}))}catch(e){}render()}catch(e){if(!restaurants.length){fatal.textContent=e.message||'Не удалось загрузить рестораны.';fatal.style.display='block'}}}
    function reset(){running=false;resultShown=false;preferredBusy=false;fallbackToken='';confirmButton.disabled=false;cancelButton.disabled=false;confirmButton.className='action primary';cancelButton.className='action cancel';confirmButton.textContent='Получить чекин';cancelButton.textContent='Отмена';cancelButton.style.display='';message.textContent='Получить чекин?'}function show(row){selected=row;reset();title.textContent=row.title;layer.classList.add('open');layer.setAttribute('aria-hidden','false');search.blur()}function hide(){if(running)return;selected=null;reset();layer.classList.remove('open');layer.setAttribute('aria-hidden','true')}
    function requestId(){try{return crypto.randomUUID().replace(/-/g,'')}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2)}}
    async function checkin(token){if(!selected||running)return;const auth=initData();if(!auth){finish({ok:false,error:'MAX не передал данные авторизации. Закройте приложение и откройте его заново.'});return}running=true;confirmButton.disabled=true;cancelButton.disabled=true;confirmButton.textContent='Получение…';message.textContent='Запрашиваем чекин…';try{const payload=await jsonp({op:'checkin',initData:auth,restaurantId:selected.id,requestId:requestId(),fallbackToken:token||''},20000);finish(payload)}catch(e){finish({ok:false,error:e.message||'Не удалось связаться с сервером.'})}}
    function busy(result){running=false;resultShown=false;preferredBusy=true;fallbackToken=String(result.fallbackToken||'');title.textContent='Карта со списанием занята';message.textContent=result.error||'Карта со списанием занята.';confirmButton.disabled=!fallbackToken;cancelButton.disabled=false;confirmButton.className='action secondary';cancelButton.className='action primary';confirmButton.textContent='Получить чекин без списания';cancelButton.textContent='Дождусь';cancelButton.style.display=''}
    function finish(result){if(result&&result.actionRequired==='preferred_card_busy'){busy(result);return}running=false;resultShown=true;preferredBusy=false;fallbackToken='';confirmButton.disabled=false;cancelButton.style.display='none';confirmButton.className='action primary';confirmButton.textContent='Ок';if(result&&result.ok){rememberRecent(selected);title.textContent='Чекин: '+String(result.checkin||'');message.textContent=String(result.restaurant||selected.title)}else{message.textContent=String(result&&result.error||'Не удалось получить чекин.')}}
    confirmButton.onclick=()=>{if(resultShown){hide();return}checkin(preferredBusy?fallbackToken:'')};cancelButton.onclick=hide;layer.onclick=e=>{if(e.target===layer&&!running)hide()};search.oninput=render;
    try{const app=webApp();if(app&&typeof app.ready==='function')app.ready()}catch(e){}
    load();
  })();
  </script>
</body>
</html>
